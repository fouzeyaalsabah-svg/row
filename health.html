<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<title>Daily Routines</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255, 255, 255, 0.04);
  --bg-secondary: rgba(255, 255, 255, 0.035);
  --bg-input: rgba(0, 0, 0, 0.28);
  --bg-input-focus: rgba(0, 0, 0, 0.36);
  --border: rgba(255, 255, 255, 0.06);
  --border-soft: rgba(255, 255, 255, 0.04);
  --border-strong: rgba(255, 255, 255, 0.12);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --text-quaternary: #4D4B47;
  --accent: #1D9E75;
  --accent-glow: rgba(29, 158, 117, 0.35);
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-secondary);
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body { min-height: 100vh; position: relative; overflow-x: hidden; }
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(60% 50% at 82% 14%, rgba(224, 118, 88, 0.16) 0%, transparent 60%),
    radial-gradient(50% 40% at 18% 90%, rgba(180, 180, 200, 0.06) 0%, transparent 60%);
  filter: blur(40px);
  pointer-events: none; z-index: 0;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none; z-index: 1;
}
@keyframes drift { 0% { transform: translate(0, 0); } 100% { transform: translate(-2%, 2%); } }

main {
  position: relative; z-index: 2;
  max-width: 720px; margin: 0 auto;
  padding: 56px 20px 80px;
}

.section-title {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin: 0 4px 14px;
  display: flex; align-items: center; gap: 12px;
}
.section-title::before { content: '≡'; font-size: 14px; opacity: 0.5; }

/* ── Routine card ── */
.routine-card {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 20px 20px 16px;
  margin-bottom: 14px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}

.routine-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.routine-icon { font-size: 20px; line-height: 1; }
.routine-title {
  flex: 1;
  font-size: 16px; font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}
.routine-progress {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  margin-right: 8px;
}
.routine-add-btn {
  width: 30px; height: 30px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: rgba(255,255,255,0.05);
  color: var(--text-primary);
  font-size: 18px; line-height: 1;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.routine-add-btn:hover { background: rgba(255,255,255,0.10); }

/* Progress bar */
.routine-bar-track {
  height: 3px; background: rgba(255,255,255,0.05);
  border-radius: 999px; overflow: hidden; margin-bottom: 14px;
}
.routine-bar-fill {
  height: 100%; width: 0%; background: #fff;
  border-radius: 999px;
  transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Checklist items */
.routine-items { display: flex; flex-direction: column; gap: 6px; }
.routine-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--bg-secondary);
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s;
}
.routine-item:hover { background: rgba(255,255,255,0.05); }
.routine-item.checked { background: rgba(29,158,117,0.08); }
.routine-item.checked .routine-item-name { text-decoration: line-through; color: var(--text-tertiary); }

.routine-check {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--border-strong);
  background: var(--bg-card);
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: transparent;
  transition: all 0.18s;
  font-family: inherit; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
.routine-check:hover { border-color: var(--accent); }
.routine-check.checked {
  background: var(--accent); border-color: var(--accent);
  color: white; box-shadow: 0 0 10px var(--accent-glow);
}
.routine-item-name {
  flex: 1; font-size: 14px; font-weight: 500;
  color: var(--text-primary); line-height: 1.3;
  min-width: 0;
}
.routine-del {
  background: transparent; border: none;
  color: var(--text-quaternary); cursor: pointer;
  font-size: 15px; padding: 4px 6px;
  border-radius: 6px; line-height: 1;
  opacity: 0; transition: opacity 0.15s, color 0.15s;
  font-family: inherit;
}
.routine-item:hover .routine-del { opacity: 1; }
.routine-del:hover { color: #FF6B6B; }

.routine-empty {
  font-size: 12px; color: var(--text-quaternary);
  font-style: italic; padding: 6px 4px;
}

/* Add input area */
.routine-add-area {
  display: flex; gap: 8px; align-items: center;
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--border-soft);
}
.routine-input {
  flex: 1;
  font-size: 13px; padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  color: var(--text-primary);
  font-family: inherit;
  transition: border-color 0.18s, background 0.18s;
}
.routine-input::placeholder { color: var(--text-tertiary); }
.routine-input:focus { outline: none; border-color: rgba(255,255,255,0.4); background: var(--bg-input-focus); }
.routine-save-btn {
  font-size: 13px; padding: 9px 16px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.85);
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
  color: #0A0A0B; font-weight: 700; cursor: pointer;
  font-family: inherit; white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 4px 14px rgba(0,0,0,0.30);
  transition: transform 0.12s;
}
.routine-save-btn:hover { transform: translateY(-1px); }
.routine-save-btn:active { transform: scale(0.97); }

/* Water embed */
.water-embed { margin-top: 40px; }
.water-iframe {
  display: block; width: 100%; height: 880px;
  border: 0; background: transparent;
  border-radius: 16px; overflow: hidden; color-scheme: dark;
}
@media (max-width: 480px) {
  .water-embed { margin-top: 32px; }
  .water-iframe { height: 780px; }
}

.attribution {
  text-align: center; margin-top: 28px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-quaternary);
}

@media (max-width: 600px) {
  main { padding: 40px 16px 60px; }
  .routine-card { padding: 16px 14px 14px; }
}

::selection { background: rgba(224, 118, 88, 0.3); color: var(--text-primary); }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<main>
  <div class="section-title">Daily Routines</div>

  <!-- Morning Routine -->
  <div class="routine-card" id="card-morning">
    <div class="routine-header">
      <span class="routine-icon">🌅</span>
      <span class="routine-title">Morning Routine</span>
      <span class="routine-progress" id="prog-morning">0/0</span>
      <button class="routine-add-btn" data-slot="morning" aria-label="Add item">+</button>
    </div>
    <div class="routine-bar-track"><div class="routine-bar-fill" id="bar-morning"></div></div>
    <div class="routine-items" id="items-morning"></div>
    <div class="routine-add-area" id="add-morning" style="display:none">
      <input type="text" class="routine-input" id="input-morning" placeholder="e.g. Cleanser, Vitamin C serum…" maxlength="80">
      <button class="routine-save-btn" data-slot="morning">Add</button>
    </div>
  </div>

  <!-- Get Ready -->
  <div class="routine-card" id="card-ready">
    <div class="routine-header">
      <span class="routine-icon">💄</span>
      <span class="routine-title">Get Ready</span>
      <span class="routine-progress" id="prog-ready">0/0</span>
      <button class="routine-add-btn" data-slot="ready" aria-label="Add item">+</button>
    </div>
    <div class="routine-bar-track"><div class="routine-bar-fill" id="bar-ready"></div></div>
    <div class="routine-items" id="items-ready"></div>
    <div class="routine-add-area" id="add-ready" style="display:none">
      <input type="text" class="routine-input" id="input-ready" placeholder="e.g. Mascara, Blush, Hair…" maxlength="80">
      <button class="routine-save-btn" data-slot="ready">Add</button>
    </div>
  </div>

  <!-- Night Routine -->
  <div class="routine-card" id="card-night">
    <div class="routine-header">
      <span class="routine-icon">🌙</span>
      <span class="routine-title">Night Routine</span>
      <span class="routine-progress" id="prog-night">0/0</span>
      <button class="routine-add-btn" data-slot="night" aria-label="Add item">+</button>
    </div>
    <div class="routine-bar-track"><div class="routine-bar-fill" id="bar-night"></div></div>
    <div class="routine-items" id="items-night"></div>
    <div class="routine-add-area" id="add-night" style="display:none">
      <input type="text" class="routine-input" id="input-night" placeholder="e.g. Double cleanse, Retinol…" maxlength="80">
      <button class="routine-save-btn" data-slot="night">Add</button>
    </div>
  </div>

  <section id="water" class="water-embed">
    <div class="section-title">Water Tracker</div>
    <iframe src="po-water.html" class="water-iframe" loading="lazy" title="Water Tracker"></iframe>
  </section>

  <div class="attribution">// all data saved in your browser</div>
</main>

<script>
(() => {
  'use strict';

  const ITEMS_KEY = 'skincare:items';
  const DONE_PREFIX = 'skincare:done:';
  const SLOTS = ['morning', 'ready', 'night'];

  function todayKey() {
    const now = new Date();
    // Reset at midnight
    return now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0');
  }

  function loadItems() {
    try { return JSON.parse(localStorage.getItem(ITEMS_KEY)) || { morning: [], ready: [], night: [] }; }
    catch { return { morning: [], ready: [], night: [] }; }
  }
  function saveItems(d) { localStorage.setItem(ITEMS_KEY, JSON.stringify(d)); }

  function loadDone() {
    const k = DONE_PREFIX + todayKey();
    try { return JSON.parse(localStorage.getItem(k)) || {}; }
    catch { return {}; }
  }
  function saveDone(d) { localStorage.setItem(DONE_PREFIX + todayKey(), JSON.stringify(d)); }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function renderSlot(slot) {
    const items = loadItems()[slot] || [];
    const done = loadDone()[slot] || {};
    const listEl = document.getElementById('items-' + slot);
    const barEl  = document.getElementById('bar-' + slot);
    const progEl = document.getElementById('prog-' + slot);

    const checkedCount = items.filter(it => done[it.id]).length;
    const total = items.length;
    barEl.style.width = total ? (checkedCount / total * 100) + '%' : '0%';
    progEl.textContent = total ? checkedCount + '/' + total : '';

    if (!items.length) {
      listEl.innerHTML = '<div class="routine-empty">No items yet — tap + to add one</div>';
      return;
    }

    listEl.innerHTML = '';
    items.forEach(it => {
      const isChecked = !!done[it.id];
      const div = document.createElement('div');
      div.className = 'routine-item' + (isChecked ? ' checked' : '');
      div.dataset.id = it.id;

      const chk = document.createElement('button');
      chk.className = 'routine-check' + (isChecked ? ' checked' : '');
      chk.type = 'button';
      chk.textContent = isChecked ? '✓' : '';
      chk.setAttribute('aria-label', 'Mark ' + it.name + ' done');
      chk.addEventListener('click', () => {
        const d = loadDone();
        if (!d[slot]) d[slot] = {};
        if (d[slot][it.id]) delete d[slot][it.id];
        else d[slot][it.id] = true;
        saveDone(d);
        renderSlot(slot);
      });

      const name = document.createElement('span');
      name.className = 'routine-item-name';
      name.textContent = it.name;

      const del = document.createElement('button');
      del.className = 'routine-del';
      del.type = 'button';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Remove ' + it.name);
      del.addEventListener('click', () => {
        const data = loadItems();
        data[slot] = (data[slot] || []).filter(x => x.id !== it.id);
        saveItems(data);
        const d = loadDone();
        if (d[slot]) delete d[slot][it.id];
        saveDone(d);
        renderSlot(slot);
      });

      div.appendChild(chk);
      div.appendChild(name);
      div.appendChild(del);
      listEl.appendChild(div);
    });
  }

  function renderAll() { SLOTS.forEach(renderSlot); }

  function addItem(slot) {
    const input = document.getElementById('input-' + slot);
    const name = (input.value || '').trim();
    if (!name) { input.focus(); return; }
    const data = loadItems();
    if (!data[slot]) data[slot] = [];
    data[slot].push({ id: uid(), name });
    saveItems(data);
    input.value = '';
    renderSlot(slot);
    input.focus();
  }

  // + buttons toggle add area
  document.querySelectorAll('.routine-add-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const slot = btn.dataset.slot;
      const area = document.getElementById('add-' + slot);
      const isOpen = area.style.display !== 'none';
      area.style.display = isOpen ? 'none' : 'flex';
      if (!isOpen) {
        btn.textContent = '×';
        document.getElementById('input-' + slot).focus();
      } else {
        btn.textContent = '+';
      }
    });
  });

  // Save buttons
  document.querySelectorAll('.routine-save-btn').forEach(btn => {
    btn.addEventListener('click', () => addItem(btn.dataset.slot));
  });

  // Enter key in inputs
  SLOTS.forEach(slot => {
    document.getElementById('input-' + slot).addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem(slot);
      if (e.key === 'Escape') {
        document.getElementById('add-' + slot).style.display = 'none';
        document.querySelector(`.routine-add-btn[data-slot="${slot}"]`).textContent = '+';
      }
    });
  });

  // Re-render on storage changes (for cross-tab/cloud sync)
  window.addEventListener('storage', renderAll);

  renderAll();
})();
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (typeof initCloudSync !== 'function') return;
  initCloudSync({
    appKey: 'health',
    syncedKeys: ['skincare:items', 'po_water_v1'],
    syncedPrefixes: ['skincare:done:'],
    onApplied: function () { window.dispatchEvent(new Event('storage')); }
  });
});
</script>

</body>
</html>
